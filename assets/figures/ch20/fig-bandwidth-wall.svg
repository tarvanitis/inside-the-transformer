<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A80036"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="a-char" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs>
<text x="310.00" y="30.00" font-size="12" fill="#4a4a4a" text-anchor="middle" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="normal" font-style="normal" dominant-baseline="middle">To make one token, the CPU reads the whole model from RAM.</text>
<text x="310.00" y="50.00" font-size="11.5" fill="#A80036" text-anchor="middle" font-family="'TeX Gyre Cursor','Courier New','DejaVu Sans Mono',monospace" font-weight="normal" font-style="normal" dominant-baseline="middle">tokens/sec  ≈  memory bandwidth  ÷  model size</text>
<text x="60.00" y="84.00" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-family="'TeX Gyre Cursor','Courier New','DejaVu Sans Mono',monospace" font-weight="normal" font-style="normal" dominant-baseline="middle">FP16  —  14 GB</text>
<rect x="60.00" y="92.00" width="380.00" height="40.00" rx="0" fill="#e9e6df" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="250.00" y="112.00" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="normal" font-style="normal" dominant-baseline="middle">stream 14 GB / token</text>
<line x1="446.00" y1="112.00" x2="486.00" y2="112.00" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#a-char)"/>
<text x="492.00" y="112.00" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="bold" font-style="normal" dominant-baseline="middle">≈ 3.5 tok/s</text>
<text x="60.00" y="160.00" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-family="'TeX Gyre Cursor','Courier New','DejaVu Sans Mono',monospace" font-weight="normal" font-style="normal" dominant-baseline="middle">Q4_K_M  —  4.1 GB</text>
<rect x="60.00" y="168.00" width="111.29" height="40.00" rx="0" fill="#f3d9e0" stroke="#A80036" stroke-width="1.2"/>
<text x="115.64" y="188.00" font-size="9.5" fill="#A80036" text-anchor="middle" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="normal" font-style="normal" dominant-baseline="middle">stream 4.1 GB / token</text>
<line x1="177.29" y1="188.00" x2="217.29" y2="188.00" stroke="#A80036" stroke-width="1.5" marker-end="url(#a-red)"/>
<text x="223.29" y="188.00" font-size="11.5" fill="#A80036" text-anchor="start" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="bold" font-style="normal" dominant-baseline="middle">≈ 12 tok/s</text>
<text x="310.00" y="246.00" font-size="10" fill="#6b6b6b" text-anchor="middle" font-family="'TeX Gyre Termes','Liberation Serif','DejaVu Serif',Georgia,serif" font-weight="normal" font-style="italic" dominant-baseline="middle">At ~50 GB/s: 50÷14 ≈ 3.5, 50÷4.1 ≈ 12. A smaller model is less to stream, so it runs faster.</text>
</svg>
